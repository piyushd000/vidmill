[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidmill"
version = "0.1.0"
description = "Open-source AI video editing toolkit: FFmpeg, Faster-Whisper, FaceFusion and DeepFilterNet as connected CLI tools any human or AI agent can orchestrate."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "vidmill contributors" }]
keywords = ["video", "editing", "ai", "ffmpeg", "whisper", "transcription", "face-swap", "cli", "agent-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.scripts]
vmill = "vidmill.cli:main"

[tool.setuptools.packages.find]
include = ["vidmill*"]
