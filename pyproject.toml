[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vidmill"
version = "0.1.0"
description = "The all-in-one AI video editor for the terminal: transcription, smart cutting, studio audio, captions, face swap and delivery presets — free, open source and fully local."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "vidmill contributors" }]
keywords = ["video", "editing", "ai", "transcription", "captions", "face-swap", "cli", "agent-tools", "video-editor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
]

[project.scripts]
vmill = "vidmill.cli:main"

[tool.setuptools.packages.find]
include = ["vidmill*"]
