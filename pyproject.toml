[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidmill"
version = "0.1.0"
description = "Open-source AI video editing toolkit: FFmpeg, Faster-Whisper, FaceFusion and DeepFilterNet as connected CLI tools any human or AI agent can orchestrate."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
license-files = ["LICENSE"]
authors = [{ name = "vidmill contributors" }]
keywords = ["video", "editing", "ai", "transcription", "captions", "face-swap", "cli", "agent-tools", "video-editor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
]

[project.scripts]
vmill = "vidmill.cli:main"

[tool.setuptools.packages.find]
include = ["vidmill*"]
