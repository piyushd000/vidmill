name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: install vidmill
        run: |
          pip install faster-whisper
          pip install -e .
      - name: syntax check
        run: python -m compileall vidmill
      - name: doctor
        run: vmill doctor
      - name: tool manifest is valid json
        run: vmill tools --json | python -m json.tool > /dev/null
